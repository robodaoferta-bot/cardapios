function renderCardapio(filtro) {
  var main = document.getElementById('cardapio');
  main.innerHTML = '';
  var cats = filtro ? CONFIG.categorias.filter(function(c) { return c.nome === filtro; }) : CONFIG.categorias;
  cats.forEach(function(cat) {
    var titulo = document.createElement('h2');
    titulo.className = 'secao-titulo';
    titulo.textContent = cat.emoji + ' ' + cat.nome;
    main.appendChild(titulo);
    var container = document.createElement('div');
    container.className = 'produtos';
    cat.itens.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'card';
      var imgHtml = item.imagem
        ? '<img src="' + item.imagem + '" alt="' + item.nome + '" loading="lazy">'
        : '<div class="sem-foto">' + cat.emoji + '</div>';
      var precoHtml = item.promoPreco
        ? '<span class="original">R$ ' + item.preco.toFixed(2).replace('.', ',') + '</span><span class="promo">R$ ' + item.promoPreco.toFixed(2).replace('.', ',') + '</span>'
        : 'R$ ' + item.preco.toFixed(2).replace('.', ',');
      card.innerHTML = imgHtml + '<div class="info"><div class="nome">' + item.nome + '</div><div class="descricao">' + item.descricao + '</div><div class="preco">' + precoHtml + '</div></div>';
      container.appendChild(card);
    });
    main.appendChild(container);
  });
}

function renderCategorias() {
  var nav = document.getElementById('categorias');
  var btnTodas = document.createElement('button');
  btnTodas.textContent = 'Todas';
  btnTodas.className = 'ativo';
  btnTodas.onclick = function() {
    document.querySelectorAll('.categorias button').forEach(function(b) { b.classList.remove('ativo'); });
    btnTodas.classList.add('ativo');
    renderCardapio(null);
  };
  nav.appendChild(btnTodas);
  CONFIG.categorias.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.textContent = cat.emoji + ' ' + cat.nome;
    btn.onclick = function() {
      document.querySelectorAll('.categorias button').forEach(function(b) { b.classList.remove('ativo'); });
      btn.classList.add('ativo');
      renderCardapio(cat.nome);
    };
    nav.appendChild(btn);
  });
}
