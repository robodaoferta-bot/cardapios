    white-space: nowrap;

  .card .preco {
    font-size: 1rem;
    font-weight: 700;
    color: var(--cor-preco);
  }
  .card .preco .original {

    color: var(--cor-subtexto);
    font-weight: 400;
    font-size: 0.85rem;
    margin-right: 6px;

  .sem-foto {

    flex-shrink: 0;

  .footer {

// Render
function renderCardapio(filtro) {
  const main = document.getElementById('cardapio');
  main.innerHTML = '';
  const cats = filtro ? CONFIG.categorias.filter(c => c.nome === filtro) : CONFIG.categorias;
  cats.forEach(cat => {
    const titulo = document.createElement('h2');
    titulo.className = 'secao-titulo';
    titulo.textContent = cat.emoji + ' ' + cat.nome;
    main.appendChild(titulo);
    const container = document.createElement('div');
    container.className = 'produtos';
    cat.itens.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const imgHtml = item.imagem
        ? '<img src="' + item.imagem + '" alt="' + item.nome + '" loading="lazy">'
        : '<div class="sem-foto">' + cat.emoji + '</div>';
      let precoHtml;
      if (item.promoPreco) {
        precoHtml = '<span class="original">R$ ' + item.preco.toFixed(2).replace('.', ',') + '</span><span class="promo">R$ ' + item.promoPreco.toFixed(2).replace('.', ',') + '</span>';
      } else {
        precoHtml = 'R$ ' + item.preco.toFixed(2).replace('.', ',');
      }
      card.innerHTML = imgHtml + '<div class="info"><div class="nome">' + item.nome + '</div><div class="descricao">' + item.descricao + '</div><div class="preco">' + precoHtml + '</div></div>';
      container.appendChild(card);
    });
    main.appendChild(container);
  });
}

function renderCategorias() {
  const nav = document.getElementById('categorias');
  const btnTodas = document.createElement('button');
  btnTodas.textContent = 'Todas';
  btnTodas.className = 'ativo';
  btnTodas.onclick = function() {
    document.querySelectorAll('.categorias button').forEach(function(b) { b.classList.remove('ativo'); });
    btnTodas.classList.add('ativo');
    renderCardapio(null);
  };
  nav.appendChild(btnTodas);
  CONFIG.categorias.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.textContent = cat.emoji + ' ' + cat.nome;
    btn.onclick = function() {
      document.querySelectorAll('.categorias button').forEach(function(b) { b.classList.remove('ativo'); });
      btn.classList.add('ativo');
      renderCardapio(cat.nome);
    };
    nav.appendChild(btn);
  });
}

document.getElementById('btnWhatsapp').href =

renderCategorias();
renderCardapio(null);
